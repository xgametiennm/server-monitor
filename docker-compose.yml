version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: game-monitor-db
    environment:
      POSTGRES_USER: postman_user
      POSTGRES_PASSWORD: postman_password
      POSTGRES_DB: postman_clone
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: game-monitor-backend
    ports:
      - "${BACKEND_PORT}:8081"
    environment:
      - DATABASE_URL=postgres://postman_user:postman_password@db:5432/postman_clone
      - PORT=8081
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: game-monitor-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
